<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>mlearn deck</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#2a3140; --fg:#e8e8e8; --dim:#9aa4b2; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--fg); display:flex; min-height:100vh; }
  #app { max-width:560px; margin:auto; padding:20px; width:100%; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .head h1 { font-size:18px; margin:0; }
  .head span { color:var(--dim); font-size:13px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:18px; min-height:300px; position:relative; }
  .card h2 { margin:0 0 4px; font-size:19px; }
  .chip { display:inline-block; background:#243044; color:#bcd3ff; border-radius:999px;
          padding:2px 10px; font-size:12px; margin-left:6px; }
  .hook { color:var(--dim); font-size:14px; margin:0 0 12px; }
  .banner { margin:12px 0; } .banner svg { width:100%; height:auto; }
  .body { font-size:15px; white-space:pre-wrap; }
  .actions { display:flex; gap:10px; justify-content:center; margin-top:14px; }
  .actions button { flex:1; max-width:140px; padding:12px 0; border:1px solid var(--line);
          border-radius:12px; background:transparent; color:var(--fg); font-size:15px; cursor:pointer; }
  .actions button:hover { border-color:#6a7d9c; }
  .done { color:var(--dim); text-align:center; margin-top:30px; }
  .err { color:#e0777e; }
  #bar { height:4px; background:var(--line); border-radius:2px; margin-bottom:12px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0%; background:#4a7fd4; transition:width .3s; }
</style>
</head>
<body>
<div id="app">
  <div class="head"><h1>mlearn · deck <span id="count"></span></h1></div>
  <div id="bar"><i id="barfill"></i></div>
  <div class="card" id="card">
    <p class="err" id="status">loading…</p>
  </div>
  <div class="actions">
    <button id="dislike">👎 Meh</button>
    <button id="skip">⏭ Skip</button>
    <button id="like">👍 Like</button>
  </div>
</div>

<script>
// A minimal tinder-style consumer of the headless mlearn REST API.
// Three calls are all a deck flow needs:
//   GET  /cards?status=ready         -> the pool (FIFO)
//   GET  /cards/{id}                 -> full card (svg banner, body)
//   POST /decide {card_id, action}   -> feedback + consume (like|dislike|skip)
const API = "http://127.0.0.1:8311";
let pool = [], idx = 0;

async function j(url, opts) {
  const r = await fetch(API + url, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

async function boot() {
  pool = await j("/cards?status=ready");
  // /cards returns newest-first (browse semantics); a deck consumes FIFO
  pool.reverse();
  document.getElementById("count").textContent = pool.length + " ready";
  if (!pool.length) { document.getElementById("card").innerHTML = '<p class="done">deck cleared 🎉</p>'; return; }
  show();
}

async function show() {
  if (idx >= pool.length) { pool = await j("/cards?status=ready"); pool.reverse(); idx = 0; if (!pool.length) { document.getElementById("card").innerHTML = '<p class="done">deck cleared 🎉</p>'; document.getElementById("barfill").style.width = "100%"; return; } }
  const c = pool[idx];
  document.getElementById("barfill").style.width = (idx / pool.length * 100) + "%";
  const st = document.getElementById("status");
  try {
    const d = await j("/cards/" + c.id);
    st.textContent = "";
    document.getElementById("card").innerHTML =
      "<h2>" + esc(d.title) + '<span class="chip">' + esc(d.topic || d.cluster_label || "?") + '</span><span class="chip">#' + d.id + '</span></h2>' +
      '<p class="hook">' + esc(d.hook || "") + "</p>" +
      (d.infographic_svg ? '<div class="banner">' + d.infographic_svg + "</div>" : "") +
      '<div class="body">' + esc((d.body_md || "").slice(0, 1200)) + "</div>";
  } catch (e) { st.textContent = "error: " + e.message; }
}

async function decide(action) {
  const c = pool[idx];
  if (!c) return;
  document.getElementById("status").textContent = "…";
  try { await j("/decide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ card_id: c.id, action }) }); }
  catch (e) { document.getElementById("status").textContent = "decide failed: " + e.message; return; }
  idx += 1;
  show();
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
document.getElementById("like").addEventListener("click", () => decide("like"));
document.getElementById("dislike").addEventListener("click", () => decide("dislike"));
document.getElementById("skip").addEventListener("click", () => decide("skip"));
boot().catch(e => document.getElementById("status").textContent = "error: " + e.message);
</script>
</body>
</html>
