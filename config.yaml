# mlearn deployed configuration (machine-specific, gitignored).
# Modeled on config.yaml.example; cards_dir points at the Obsidian vault.

buffer_target: 20
buffer_floor: 8
batch_size: 12
daily_cap: 5
discovery_ratio: 0.7    # legacy; mornings are pure discovery now
wildcard_rate: 0.15
exploration_floor: 0.03
taste_strength: 1.0     # granular (embedding-level) feedback weight; 0 disables
daily_retention_cap: 5  # evening spaced-repetition prompts per day
dedupe_threshold: 0.92
profile_lambda: 0.1
decay_factor: 0.95
probation_cards: 20
max_probation_sources: 3
retention_target: 0.9

paths:
  data_dir: data
  raw_dir: data/raw
  cards_dir: /Users/danielwallner/dev/private-notes/Learning/mlearn/cards
  db: data/app.db
  sources: sources.yaml
  config: config.yaml

generate:
  provider: local
  model: deepseek-v4-flash
  base_url: http://127.0.0.1:8642/v1
  api_key_env: API_SERVER_KEY
  temperature: 0.4
  max_retries: 3
  reasoning_effort: max

embed:
  provider: local
  model: BAAI/bge-small-en-v1.5

api:
  host: 127.0.0.1
  port: 8311